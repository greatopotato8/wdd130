<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Tate Ellsworth">
    <meta name="description" content="White Water Rafting is the official site for all things
      rafting with training and vacation trips.">
    <title>Contact Us, White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css" />
</head>

<body>
    <header>
        <img src="images/whitewwr.png" alt="White Water Rafting" />
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact-page">
        <h3>White Water Rafting Company</h3>
        <h4>123 Centerlake Avenue
            <br>
            Kolob California
            <br>
            +1 999 999 9999
            <br>
            info@whitewater.com
        </h4>
        <div class="contact-map">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3236.9733758441184!2d-123.41563321929722!3d46.982133873041484!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1790977483619!5m2!1sen!2sus"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form class="contact-form">
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email">
                </div>

                <div class="purpose-group">

                    <label for="message-purpose">Message Purpose: </label>
                    <ul>
                        <div>
                            <input type="radio" id="general-inquiry" name="message-purpose">
                            <label for="message-purpose">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" id="reservation-question" name="message-purpose">
                            <label for="message-purpose">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" id="website-suggestion" name="message-purpose">
                            <label for="message-purpose">Website Suggestion</label>
                        </div>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message"></textarea>
                </div>

                <div class="subscribe-box">
                    <label>
                        <input type="checkbox" name="subscribe" id="subscribe">
                        Please subscribe me to the monthly newsletter</label>
                </div>

                <div class="btn">
                    <button>Get In Touch!</button>
                </div>
            </form>
        </div>
        <h2>We are here to serve you</h2>
        <div class="manage">

            <figure>
                <img src="images/manager.jpg" alt="manager">
                <figcaption class="managecap">Manager</figcaption>
            </figure>
            <figure>
                <img src="images/assistant.jpg" alt="assistant">
                <figcaption class="managecap">Assistant Manager</figcaption>
            </figure>
            <figure>
                <img src="images/guide.jpg" alt="guide">
                <figcaption class="managecap">River Guide</figcaption>
            </figure>
        </div>
    </main>


    <footer class="container">
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook.png" alt="Facebook Icon" />
            </a>

            <a href="https://www.instagram.com/?hl=en">
                <img src="images/instagram.jpg" alt="Instagram Icon" />
            </a>

            <a href="https://www.linkedin.com/">
                <img src="images/linkedin.png" alt="LinkedIn Icon" />
            </a>
        </nav>
        <p>©2026 | White Water Rafting | Tate Ellsworth | v.2.0</p>
    </footer>
</body>

</html>
